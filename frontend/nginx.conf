# 프론트 정적 서빙 + /api → bff 프록시(SSE 포함). SPA 폴백.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # BFF 외부 표면. SSE(/extraction/stream)를 위해 버퍼링 끄기.
    location /api/ {
        proxy_pass http://bff:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # SPA — 없는 경로는 index.html 로.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
