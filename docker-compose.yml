# PKMS 통합 — Docker Compose
# T-80 스켈레톤. 볼륨·healthcheck·모델 build-time bake·시드 초기인덱싱은 T-81 에서 완성한다.
# 실행: docker compose up --build
# 원칙: 키는 이미지에 넣지 않는다 — 호스트 env(Studio_API_Key·ANTHROPIC_API_KEY)로만 주입. 로그 마스킹.
#   경량(mock) 기본. full(local ML): INCLUDE_ML=true EMBEDDING_PROVIDER=local docker compose up --build

services:
  knowledge:
    build:
      context: ./knowledge
      args:
        INCLUDE_ML: "${INCLUDE_ML:-false}"
    environment:
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-mock}"
    ports:
      - "8000:8000"
    # T-81: data/{oxigraph,chroma}·모델캐시 named volume + healthcheck(reasoner=ok=JRE 증거)

  bff:
    build:
      context: ./bff
    environment:
      KNOWLEDGE_URL: "http://knowledge:8000"
      BFF_PORT: "4000"
      AI_MOCK_MODE: "${AI_MOCK_MODE:-false}"
      AI_PROVIDER: "${AI_PROVIDER:-solar}"
      # 키 없으면 gateway 가 mock 으로 그레이스풀 폴백(운영은 Studio_API_Key 주입).
      Studio_API_Key: "${Studio_API_Key:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    depends_on:
      - knowledge   # T-81: condition service_healthy
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - bff
    ports:
      - "8080:80"
